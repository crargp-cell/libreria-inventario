services:
  db:
    image: postgres:16-alpine
    container_name: libreria_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Definir POSTGRES_PASSWORD en un .env (no versionado); sin valor, docker compose falla.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-libreria_db}
    # Solo accesible desde la propia máquina
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
